<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>缓冲 · MB实验室</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #1e2f3c;
            --secondary-color: #2c3e50;
            --accent-color: #496797;
            --text-color: #1e2a36;
            --light-color: #f0f4f8;
            --white: #ffffff;
            --warning-color: #c0392b;
            --physics-highlight: #1f6392;
            --green-glow: #61b84c;
            --dark-overlay: rgba(20, 34, 43, 0.92);
        }

        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            background-color: var(--light-color);
            color: var(--text-color);
            line-height: 1.55;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(circle at 30% 40%, rgba(73, 103, 151, 0.06) 0%, transparent 30%),
                radial-gradient(circle at 80% 70%, rgba(31, 99, 146, 0.05) 0%, transparent 35%),
                linear-gradient(145deg, #eef2f7 0%, #f0f4f8 100%);
            padding: 20px;
        }

        .buffer-card {
            max-width: 760px;
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            border-radius: 44px;
            padding: 50px 45px 45px;
            box-shadow: 
                0 30px 60px rgba(30, 47, 60, 0.18),
                0 0 0 1px rgba(255, 255, 255, 0.6) inset,
                0 0 0 2px rgba(73, 103, 151, 0.08);
            text-align: center;
            transition: all 0.3s ease;
            border: 1px solid #e2e8f0;
            position: relative;
        }

        .buffer-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 5px;
            background: linear-gradient(90deg, transparent, var(--accent-color), var(--physics-highlight), transparent);
            border-radius: 0 0 6px 6px;
            opacity: 0.7;
        }

        .buffer-header {
            margin-bottom: 28px;
        }

        .buffer-header h1 {
            font-size: 2.6rem;
            color: var(--primary-color);
            font-weight: 700;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }

        .buffer-header h1 i {
            color: var(--accent-color);
            font-size: 2.2rem;
            background: linear-gradient(135deg, var(--accent-color), var(--physics-highlight));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 4px 6px rgba(73, 103, 151, 0.2));
        }

        .buffer-sub {
            font-size: 1.05rem;
            color: #3d4f5e;
            margin-top: 8px;
            letter-spacing: 1px;
            font-weight: 400;
            border-bottom: 2px dashed #ffb347;
            display: inline-block;
            padding-bottom: 8px;
            padding-inline: 12px;
        }

        /* 加载文字 */
        .loading-text {
            font-size: 1.2rem;
            letter-spacing: 2px;
            background: rgba(30, 47, 60, 0.08);
            padding: 8px 24px;
            border-radius: 40px;
            display: inline-block;
            color: var(--secondary-color);
            font-weight: 500;
            margin: 25px 0 25px;
            border: 1px solid rgba(73, 103, 151, 0.15);
            backdrop-filter: blur(2px);
        }

        .loading-text i {
            color: var(--accent-color);
            animation: spin 2.5s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 进度条 */
        .progress-container {
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 10px;
            margin: 20px 0 28px;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), var(--physics-highlight), #61b84c);
            border-radius: 10px;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px rgba(73, 103, 151, 0.5);
        }

        /* 进入官网按钮 */
        .enter-btn {
            background: linear-gradient(145deg, var(--accent-color), #3a5a7a);
            border: none;
            color: white;
            padding: 18px 48px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.3rem;
            cursor: pointer;
            box-shadow: 0 12px 30px rgba(73, 103, 151, 0.4), 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            letter-spacing: 1.5px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            margin-top: 8px;
            width: auto;
            min-width: 260px;
        }

        .enter-btn i {
            font-size: 1.4rem;
            transition: transform 0.2s;
        }

        .enter-btn:hover {
            background: linear-gradient(145deg, #3a5a7a, #2c4a66);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 20px 38px rgba(73, 103, 151, 0.55), 0 6px 14px rgba(0, 0, 0, 0.15);
        }

        .enter-btn:hover i {
            transform: translateX(6px);
        }

        .enter-btn:active {
            transform: translateY(0px) scale(0.99);
            box-shadow: 0 8px 18px rgba(73, 103, 151, 0.4);
        }

        /* 底部备注 */
        .buffer-footer-note {
            margin-top: 28px;
            font-size: 0.8rem;
            color: #7e8c9e;
            border-top: 1px solid #e2e8f0;
            padding-top: 18px;
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .buffer-footer-note i {
            color: var(--accent-color);
            margin-right: 4px;
        }

        /* 时钟 */
        .physics-clock {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: rgba(30, 47, 60, 0.85);
            backdrop-filter: blur(8px);
            color: #f5f9ff;
            padding: 8px 18px;
            border-radius: 48px;
            font-family: 'Courier New', 'Fira Code', monospace;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
            z-index: 1000;
            border: 1px solid rgba(80, 151, 73, 0.6);
            letter-spacing: 2px;
            transition: all 0.2s ease;
            display: flex;
            align-items: baseline;
            gap: 4px;
            font-size: 1.4rem;
        }

        .physics-clock .digit {
            background: #000000aa;
            padding: 0 6px;
            border-radius: 12px;
            min-width: 34px;
            text-align: center;
            font-weight: 700;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .physics-clock .colon {
            margin: 0 2px;
            animation: blink 1s step-end infinite;
            font-weight: 700;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* 加载完成提示 */
        .buffer-note {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #3d5a73;
            min-height: 24px;
        }

        /* 响应式调整 */
        @media (max-width: 600px) {
            .buffer-card {
                padding: 35px 22px 30px;
                border-radius: 32px;
            }

            .buffer-header h1 {
                font-size: 2rem;
                gap: 8px;
            }

            .buffer-header h1 i {
                font-size: 1.8rem;
            }

            .enter-btn {
                padding: 15px 28px;
                font-size: 1.1rem;
                min-width: 220px;
            }

            .physics-clock {
                font-size: 1rem;
                padding: 6px 12px;
                bottom: 16px;
                right: 16px;
            }

            .physics-clock .digit {
                min-width: 26px;
                padding: 0 4px;
            }
        }

        @media (max-width: 380px) {
            .buffer-header h1 {
                font-size: 1.7rem;
            }

            .enter-btn {
                font-size: 1rem;
                padding: 14px 20px;
                min-width: 190px;
            }

            .physics-clock {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <!-- 时钟 -->
    <div class="physics-clock" id="clock">
        <span class="digit" id="hour-tens">0</span><span class="digit" id="hour-ones">0</span>
        <span class="colon">:</span>
        <span class="digit" id="min-tens">0</span><span class="digit" id="min-ones">0</span>
        <span class="colon">:</span>
        <span class="digit" id="sec-tens">0</span><span class="digit" id="sec-ones">0</span>
    </div>

    <!-- 主缓冲卡片 -->
    <div class="buffer-card">

        <div class="buffer-header">
            <h1>
                <i class="fas fa-flask"></i> MB实验室
            </h1>
        </div>

        <div class="loading-text">
            <i class="fas fa-atom"></i> 网络检测完成
        </div>

        <!-- 进度条 -->
        <div class="progress-container">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <!-- 进入按钮 -->
        <button class="enter-btn" id="enterBtn">
            <i class="fas fa-rocket"></i> 进入官网
        </button>

        <!-- 底部备注 -->
        <div class="buffer-footer-note">
            <span><i class="fas fa-shield-alt"></i> 安全连接</span>
            <span><i class="fas fa-microchip"></i> 初中物理全知识点</span>
            <span><i class="fas fa-sync-alt"></i> v3.1.5</span>
        </div>

        <div class="buffer-note" id="bufferNote">
            <!-- 动态提示文字 -->
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ========== 时钟 ==========
            function updateClock() {
                const now = new Date();
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');

                document.getElementById('hour-tens').textContent = hours[0];
                document.getElementById('hour-ones').textContent = hours[1];
                document.getElementById('min-tens').textContent = minutes[0];
                document.getElementById('min-ones').textContent = minutes[1];
                document.getElementById('sec-tens').textContent = seconds[0];
                document.getElementById('sec-ones').textContent = seconds[1];
            }
            updateClock();
            setInterval(updateClock, 1000);

            // ========== 进度条模拟 ==========
            const progressFill = document.getElementById('progressFill');
            const bufferNote = document.getElementById('bufferNote');
            const enterBtn = document.getElementById('enterBtn');

            let progress = 0;
            const progressInterval = setInterval(() => {
                if (progress < 90) {
                    const step = Math.random() * 4 + 1.5;
                    progress = Math.min(progress + step, 90);
                    progressFill.style.width = progress + '%';
                }
            }, 120);

            // 页面完全加载后，补满进度条并提示
            window.addEventListener('load', function() {
                setTimeout(() => {
                    clearInterval(progressInterval);
                    progressFill.style.width = '100%';
                    bufferNote.innerHTML = '<i class="fas fa-check-circle" style="color:#61b84c;"></i> 点击进入官网';
                    // 按钮短暂高亮
                    enterBtn.style.transition = 'all 0.3s ease';
                    enterBtn.style.boxShadow = '0 0 30px rgba(97, 184, 76, 0.7)';
                    setTimeout(() => {
                        enterBtn.style.boxShadow = '0 12px 30px rgba(73, 103, 151, 0.4), 0 4px 10px rgba(0, 0, 0, 0.1)';
                    }, 600);
                }, 300);
            });

            // ========== 进入官网按钮 ==========
            enterBtn.addEventListener('click', function() {
                // 跳转到官网
                window.location.href = 'https://sdey666.github.io/mb/usuabbe.html';
            });

            // 本地文件协议提示
            if (window.location.protocol === 'file:') {
                console.log('缓冲页运行在本地文件协议，请确保 index.html 在同一目录下。');
            }
        })();
    </script>
    <script>
    // ============================================================
    // 禁止访问源代码 / 禁止开发者工具模块
    // 说明：此模块通过多种方式增加查看/调试源代码的难度
    // 注意：无法100%阻止，但可阻挡大部分普通用户
    // ============================================================
    (function() {
        'use strict';

        // 1. 禁用右键菜单
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            // 可选：显示一个轻提示（不干扰页面）
            // console.log('右键菜单已禁用');
            return false;
        }, { capture: true });

        // 2. 禁用开发者工具快捷键 & 查看源代码快捷键
        document.addEventListener('keydown', function(e) {
            // 阻止 F12
            if (e.key === 'F12' || e.keyCode === 123) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }

            // 阻止 Ctrl+Shift+I (开发者工具)
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.keyCode === 73)) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }

            // 阻止 Ctrl+Shift+J (控制台)
            if (e.ctrlKey && e.shiftKey && (e.key === 'J' || e.key === 'j' || e.keyCode === 74)) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }

            // 阻止 Ctrl+Shift+C (审查元素)
            if (e.ctrlKey && e.shiftKey && (e.key === 'C' || e.key === 'c' || e.keyCode === 67)) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }

            // 阻止 Ctrl+U (查看源代码)
            if (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.keyCode === 85)) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }

            // 阻止 Ctrl+S (保存页面)
            if (e.ctrlKey && (e.key === 'S' || e.key === 's' || e.keyCode === 83)) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }

            // 阻止 Alt+W 冲突? 原功能保留，不干扰
            // 阻止 Ctrl+Shift+K (Firefox 控制台)
            if (e.ctrlKey && e.shiftKey && (e.key === 'K' || e.key === 'k' || e.keyCode === 75)) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }

            // 阻止 Ctrl+Shift+E (网络面板)
            if (e.ctrlKey && e.shiftKey && (e.key === 'E' || e.key === 'e' || e.keyCode === 69)) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        }, { capture: true });

        // 3. 开发者工具检测（基于调试器时间差 / 窗口尺寸差异）
        //    当检测到开发者工具可能打开时，用遮罩覆盖页面并提示
        let devtoolsDetected = false;
        const overlayId = 'devtools-block-overlay';

        // 创建遮罩元素（隐藏，检测到才显示）
        function createOverlay() {
            if (document.getElementById(overlayId)) return;

            const overlay = document.createElement('div');
            overlay.id = overlayId;
            overlay.style.cssText = `
                position: fixed;
                inset: 0;
                z-index: 999999;
                background: #1a0a0a;
                display: none;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                color: #ffe9b0;
                font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
                text-align: center;
                padding: 40px;
                letter-spacing: 2px;
                pointer-events: all;
                user-select: none;
            `;
            overlay.innerHTML = `
                <div style="font-size: 4rem; margin-bottom: 20px;"></div>
                <div style="font-size: 2rem; font-weight: 800; text-shadow: 0 4px 0 #9e0000, 0 8px 18px #ffaa00;">
                    请关闭开发者工具
                </div>
                <div style="font-size: 1.2rem; margin-top: 16px; color: #ffcc88; max-width: 600px; line-height: 1.8;">
                    本页面禁止查看或调试源代码。<br>
                    请关闭浏览器开发者工具后刷新页面继续访问。
                </div>
                <div style="font-size: 0.9rem; margin-top: 30px; opacity: 0.7;">
                    感谢配合 MB实验室
                </div>
            `;
            document.body.appendChild(overlay);
        }

        // 显示遮罩
        function showOverlay() {
            if (devtoolsDetected) return;
            devtoolsDetected = true;
            createOverlay();
            const overlay = document.getElementById(overlayId);
            if (overlay) {
                overlay.style.display = 'flex';
            }
            // 同时禁用滚动
            document.body.style.overflow = 'hidden';
        }

        // 隐藏遮罩（如果开发者工具关闭）
        function hideOverlay() {
            if (!devtoolsDetected) return;
            devtoolsDetected = false;
            const overlay = document.getElementById(overlayId);
            if (overlay) {
                overlay.style.display = 'none';
            }
            document.body.style.overflow = '';
        }

        // 检测方式1：窗口尺寸差异（打开开发者工具通常会改变窗口内尺寸）
        function checkWindowSize() {
            const widthThreshold = 160;  // 宽度差阈值
            const heightThreshold = 160; // 高度差阈值

            const widthDiff = window.outerWidth - window.innerWidth;
            const heightDiff = window.outerHeight - window.innerHeight;

            if (widthDiff > widthThreshold || heightDiff > heightThreshold) {
                showOverlay();
            } else {
                // 如果之前检测到，现在关闭了，则隐藏
                if (devtoolsDetected) {
                    hideOverlay();
                }
            }
        }

        // 检测方式2：调试器时间差检测（通过 debugger 语句）
        function checkDebugger() {
            const startTime = performance.now();
            // 使用 debugger 语句，如果开发者工具打开，会在此处暂停
            // 但为了不真正打断用户，我们使用 setInterval + debugger 的变体？
            // 更好的方式：利用 console.log 的 getter 或 toString 检测
            // 这里使用一个经典的检测方法：重写 toString 并检查
            // 但为了避免误伤，我们仅作为辅助

            // 简单方式：如果开发者工具打开，performance.now() 会因为断点而出现大延迟
            // 但 debugger 会实际暂停，影响体验。我们改用基于 console 的检测：
            const element = new Image();
            Object.defineProperty(element, 'id', {
                get: function() {
                    // 当开发者工具控制台尝试打印此元素时触发
                    showOverlay();
                    return 'devtools-detected';
                }
            });
            // 在控制台输出这个元素会触发 getter，但普通用户不会输出
            // 我们主动 console.log 一下？会干扰控制台。不主动输出。
            // 更好的方案：使用正则检测 /devtools/i 等
        }

        // 实际可用的检测：使用 devtools-detect 库的简化版（基于窗口尺寸 + 定时器）
        // 以及基于 debugger 的检测（但会暂停，不适合）

        // 我们采用窗口尺寸检测 + 一个隐藏的 debugger 定时检测（延迟检测，不暂停主线程）
        // 使用 setInterval 周期性检查窗口尺寸

        // 4. 额外的防护：检测到控制台打开时，重定向或显示遮罩
        //    通过 console.log 的 getter 检测（在控制台打开时，可能会触发某些属性的读取）
        //    但容易误伤，暂不使用。

        // 启动窗口尺寸检测
        let sizeCheckInterval = null;

        function startSizeDetection() {
            if (sizeCheckInterval) clearInterval(sizeCheckInterval);
            sizeCheckInterval = setInterval(checkWindowSize, 800);
            // 立即执行一次
            checkWindowSize();
        }

        // 当窗口大小改变时也检测
        window.addEventListener('resize', function() {
            checkWindowSize();
        });

        // 页面加载完成后启动检测
        if (document.readyState === 'complete') {
            startSizeDetection();
        } else {
            window.addEventListener('load', startSizeDetection);
        }

        // 5. 禁用文本选择（可选，防止复制源代码）
        // 原页面已有 user-select: none，此处不再重复

        // 6. 防止通过 iframe 嵌入查看源代码（可选）
        if (window.self !== window.top) {
            // 如果页面被嵌入 iframe，可以尝试禁止
            // 但为了不影响正常使用，仅作提示
            // try { window.top.location = window.self.location; } catch(e) {}
        }

        // 7. 清除控制台（可选，但会干扰调试，谨慎使用）
        // 不自动清除，以免影响用户体验 

        // 8. 检测到开发者工具时，还可以阻止某些操作
        // 这里不做额外限制

        // 记录日志（仅用于调试，发布时可注释）
        // console.log('源代码保护模块已启用');

        // 9. 防止通过 document.documentElement.outerHTML 获取（无法完全防止）
        // 仅增加难度

        // 10. 针对键盘快捷键的补充：阻止 Alt 键组合（除了 Alt+W 保留）
        // 已经在 keydown 中处理

        // 11. 针对移动端长按菜单等
        document.addEventListener('touchstart', function(e) {
            // 不阻止正常触摸，但可以阻止长按菜单（通过 contextmenu 已处理）
        }, { passive: true });

        // 12. 禁用拖拽查看源码（如图片拖拽）
        document.addEventListener('dragstart', function(e) {
            e.preventDefault();
            return false;
        });

        // 13. 禁用复制（可选，但会影响正常使用，如复制文字）
        // 不全局禁用，仅针对代码区域（但源码本身无法复制）

        // 14. 最终：如果检测到开发者工具，遮罩会覆盖页面
        //     并且每 1.5 秒检测一次，若关闭则隐藏遮罩

        // 为了更精准，我们结合多种检测方式：
        // - 窗口尺寸差
        // - 控制台打开时 console.log 的 getter 检测（使用一个特殊对象）
        // - debugger 检测（不采用，因为会暂停）

        // 使用 console 检测（高级）：
        (function() {
            const devtools = {
                isOpen: false,
                orientation: undefined
            };

            const threshold = 160;

            const emitEvent = (isOpen, orientation) => {
                // 如果状态改变，更新遮罩
                if (isOpen && !devtools.isOpen) {
                    showOverlay();
                } else if (!isOpen && devtools.isOpen) {
                    hideOverlay();
                }
                devtools.isOpen = isOpen;
                devtools.orientation = orientation;
            };

            const check = () => {
                const widthDiff = window.outerWidth - window.innerWidth;
                const heightDiff = window.outerHeight - window.innerHeight;

                // 水平方向
                if (widthDiff > threshold) {
                    emitEvent(true, 'vertical');
                    return;
                }
                // 垂直方向
                if (heightDiff > threshold) {
                    emitEvent(true, 'horizontal');
                    return;
                }

                // 额外：如果窗口尺寸非常小，也可能是开发者工具停靠
                if (window.innerWidth < 400 || window.innerHeight < 300) {
                    // 可能移动端，忽略
                }

                emitEvent(false, undefined);
            };

            // 定期检查
            setInterval(check, 1000);
            check();

            // 暴露给全局？不需要
        })();

        // 注意：以上检测可能因浏览器和操作系统而异，但能覆盖大部分情况

    })();
</script>
