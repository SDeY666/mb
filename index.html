<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>缓冲 · MB实验室</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #1e2f3c;
            --secondary-color: #2c3e50;
            --accent-color: #496797;
            --text-color: #1e2a36;
            --light-color: #f0f4f8;
            --white: #ffffff;
            --warning-color: #c0392b;
            --physics-highlight: #1f6392;
            --green-glow: #61b84c;
            --dark-overlay: rgba(20, 34, 43, 0.92);
        }

        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            background-color: var(--light-color);
            color: var(--text-color);
            line-height: 1.55;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(circle at 30% 40%, rgba(73, 103, 151, 0.06) 0%, transparent 30%),
                radial-gradient(circle at 80% 70%, rgba(31, 99, 146, 0.05) 0%, transparent 35%),
                linear-gradient(145deg, #eef2f7 0%, #f0f4f8 100%);
            padding: 20px;
        }

        .buffer-card {
            max-width: 760px;
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            border-radius: 44px;
            padding: 50px 45px 45px;
            box-shadow: 
                0 30px 60px rgba(30, 47, 60, 0.18),
                0 0 0 1px rgba(255, 255, 255, 0.6) inset,
                0 0 0 2px rgba(73, 103, 151, 0.08);
            text-align: center;
            transition: all 0.3s ease;
            border: 1px solid #e2e8f0;
            position: relative;
        }

        .buffer-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 5px;
            background: linear-gradient(90deg, transparent, var(--accent-color), var(--physics-highlight), transparent);
            border-radius: 0 0 6px 6px;
            opacity: 0.7;
        }

        .buffer-header {
            margin-bottom: 28px;
        }

        .buffer-header h1 {
            font-size: 2.6rem;
            color: var(--primary-color);
            font-weight: 700;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }

        .buffer-header h1 i {
            color: var(--accent-color);
            font-size: 2.2rem;
            background: linear-gradient(135deg, var(--accent-color), var(--physics-highlight));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 4px 6px rgba(73, 103, 151, 0.2));
        }

        .buffer-sub {
            font-size: 1.05rem;
            color: #3d4f5e;
            margin-top: 8px;
            letter-spacing: 1px;
            font-weight: 400;
            border-bottom: 2px dashed #ffb347;
            display: inline-block;
            padding-bottom: 8px;
            padding-inline: 12px;
        }

        /* 加载文字 */
        .loading-text {
            font-size: 1.2rem;
            letter-spacing: 2px;
            background: rgba(30, 47, 60, 0.08);
            padding: 8px 24px;
            border-radius: 40px;
            display: inline-block;
            color: var(--secondary-color);
            font-weight: 500;
            margin: 25px 0 25px;
            border: 1px solid rgba(73, 103, 151, 0.15);
            backdrop-filter: blur(2px);
        }

        .loading-text i {
            color: var(--accent-color);
            animation: spin 2.5s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 进度条 */
        .progress-container {
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 10px;
            margin: 20px 0 28px;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), var(--physics-highlight), #61b84c);
            border-radius: 10px;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px rgba(73, 103, 151, 0.5);
        }

        /* 进入官网按钮 */
        .enter-btn {
            background: linear-gradient(145deg, var(--accent-color), #3a5a7a);
            border: none;
            color: white;
            padding: 18px 48px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.3rem;
            cursor: pointer;
            box-shadow: 0 12px 30px rgba(73, 103, 151, 0.4), 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            letter-spacing: 1.5px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            margin-top: 8px;
            width: auto;
            min-width: 260px;
        }

        .enter-btn i {
            font-size: 1.4rem;
            transition: transform 0.2s;
        }

        .enter-btn:hover {
            background: linear-gradient(145deg, #3a5a7a, #2c4a66);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 20px 38px rgba(73, 103, 151, 0.55), 0 6px 14px rgba(0, 0, 0, 0.15);
        }

        .enter-btn:hover i {
            transform: translateX(6px);
        }

        .enter-btn:active {
            transform: translateY(0px) scale(0.99);
            box-shadow: 0 8px 18px rgba(73, 103, 151, 0.4);
        }

        /* 底部备注 */
        .buffer-footer-note {
            margin-top: 28px;
            font-size: 0.8rem;
            color: #7e8c9e;
            border-top: 1px solid #e2e8f0;
            padding-top: 18px;
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .buffer-footer-note i {
            color: var(--accent-color);
            margin-right: 4px;
        }

        /* 时钟 */
        .physics-clock {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: rgba(30, 47, 60, 0.85);
            backdrop-filter: blur(8px);
            color: #f5f9ff;
            padding: 8px 18px;
            border-radius: 48px;
            font-family: 'Courier New', 'Fira Code', monospace;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
            z-index: 1000;
            border: 1px solid rgba(80, 151, 73, 0.6);
            letter-spacing: 2px;
            transition: all 0.2s ease;
            display: flex;
            align-items: baseline;
            gap: 4px;
            font-size: 1.4rem;
        }

        .physics-clock .digit {
            background: #000000aa;
            padding: 0 6px;
            border-radius: 12px;
            min-width: 34px;
            text-align: center;
            font-weight: 700;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .physics-clock .colon {
            margin: 0 2px;
            animation: blink 1s step-end infinite;
            font-weight: 700;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* 加载完成提示 */
        .buffer-note {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #3d5a73;
            min-height: 24px;
        }

        /* 响应式调整 */
        @media (max-width: 600px) {
            .buffer-card {
                padding: 35px 22px 30px;
                border-radius: 32px;
            }

            .buffer-header h1 {
                font-size: 2rem;
                gap: 8px;
            }

            .buffer-header h1 i {
                font-size: 1.8rem;
            }

            .enter-btn {
                padding: 15px 28px;
                font-size: 1.1rem;
                min-width: 220px;
            }

            .physics-clock {
                font-size: 1rem;
                padding: 6px 12px;
                bottom: 16px;
                right: 16px;
            }

            .physics-clock .digit {
                min-width: 26px;
                padding: 0 4px;
            }
        }

        @media (max-width: 380px) {
            .buffer-header h1 {
                font-size: 1.7rem;
            }

            .enter-btn {
                font-size: 1rem;
                padding: 14px 20px;
                min-width: 190px;
            }

            .physics-clock {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <!-- 时钟 -->
    <div class="physics-clock" id="clock">
        <span class="digit" id="hour-tens">0</span><span class="digit" id="hour-ones">0</span>
        <span class="colon">:</span>
        <span class="digit" id="min-tens">0</span><span class="digit" id="min-ones">0</span>
        <span class="colon">:</span>
        <span class="digit" id="sec-tens">0</span><span class="digit" id="sec-ones">0</span>
    </div>

    <!-- 主缓冲卡片 -->
    <div class="buffer-card">

        <div class="buffer-header">
            <h1>
                <i class="fas fa-flask"></i> MB实验室
            </h1>
        </div>

        <div class="loading-text">
            <i class="fas fa-atom"></i> 网络检测完成
        </div>

        <!-- 进度条 -->
        <div class="progress-container">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <!-- 进入按钮 -->
        <button class="enter-btn" id="enterBtn">
            <i class="fas fa-rocket"></i> 进入官网
        </button>

        <!-- 底部备注 -->
        <div class="buffer-footer-note">
            <span><i class="fas fa-shield-alt"></i> 安全连接</span>
            <span><i class="fas fa-microchip"></i> 初中物理全知识点</span>
            <span><i class="fas fa-sync-alt"></i> v3.1.5</span>
        </div>

        <div class="buffer-note" id="bufferNote">
            <!-- 动态提示文字 -->
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ========== 时钟 ==========
            function updateClock() {
                const now = new Date();
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');

                document.getElementById('hour-tens').textContent = hours[0];
                document.getElementById('hour-ones').textContent = hours[1];
                document.getElementById('min-tens').textContent = minutes[0];
                document.getElementById('min-ones').textContent = minutes[1];
                document.getElementById('sec-tens').textContent = seconds[0];
                document.getElementById('sec-ones').textContent = seconds[1];
            }
            updateClock();
            setInterval(updateClock, 1000);

            // ========== 进度条模拟 ==========
            const progressFill = document.getElementById('progressFill');
            const bufferNote = document.getElementById('bufferNote');
            const enterBtn = document.getElementById('enterBtn');

            let progress = 0;
            const progressInterval = setInterval(() => {
                if (progress < 90) {
                    const step = Math.random() * 4 + 1.5;
                    progress = Math.min(progress + step, 90);
                    progressFill.style.width = progress + '%';
                }
            }, 120);

            // 页面完全加载后，补满进度条并提示
            window.addEventListener('load', function() {
                setTimeout(() => {
                    clearInterval(progressInterval);
                    progressFill.style.width = '100%';
                    bufferNote.innerHTML = '<i class="fas fa-check-circle" style="color:#61b84c;"></i> 点击进入官网';
                    // 按钮短暂高亮
                    enterBtn.style.transition = 'all 0.3s ease';
                    enterBtn.style.boxShadow = '0 0 30px rgba(97, 184, 76, 0.7)';
                    setTimeout(() => {
                        enterBtn.style.boxShadow = '0 12px 30px rgba(73, 103, 151, 0.4), 0 4px 10px rgba(0, 0, 0, 0.1)';
                    }, 600);
                }, 300);
            });

            // ========== 进入官网按钮 ==========
            enterBtn.addEventListener('click', function() {
                // 跳转到官网
                window.location.href = 'https://sdey666.github.io/mb/usuabbe.html';
            });

            // 本地文件协议提示
            if (window.location.protocol === 'file:') {
                console.log('缓冲页运行在本地文件协议，请确保 index.html 在同一目录下。');
            }
        })();
    </script>
    
</body>
</html>
