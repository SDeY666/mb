<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>欢度国庆</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
    body {
        min-height:100vh;
        background: linear-gradient(145deg, #2b0a0a 0%, #4a1010 40%, #6b1a1a 100%);
        display:flex; justify-content:center; align-items:center;
        font-family:'Segoe UI','PingFang SC',Roboto,'Helvetica Neue',sans-serif;
        padding:20px; position:relative; overflow-x:hidden;
    }
    body::before {
        content:''; position:absolute; inset:0;
        background-image: radial-gradient(2px 2px at 20px 30px, #ffd966, transparent),
                          radial-gradient(2px 2px at 40px 70px, #fff9c4, transparent),
                          radial-gradient(3px 3px at 120px 200px, #ffe082, transparent),
                          radial-gradient(1px 1px at 300px 100px, #ffffff, transparent),
                          radial-gradient(2px 2px at 400px 300px, #ffecb3, transparent),
                          radial-gradient(3px 3px at 700px 150px, #ffd54f, transparent);
        background-repeat:repeat; background-size:600px 400px;
        opacity:0.15; pointer-events:none;
    }
    .main-card {
        background:#1a0a0a; border:2px solid rgba(255,215,0,0.5);
        border-radius:48px; padding:32px 28px 40px;
        box-shadow:0 30px 45px rgba(0,0,0,0.7), 0 0 0 2px rgba(255,215,0,0.2) inset;
        display:flex; flex-direction:column; align-items:center;
        max-width:720px; width:100%; transition:box-shadow 0.4s;
    }
    .main-card:hover { box-shadow:0 35px 55px rgba(0,0,0,0.8), 0 0 0 2px rgba(255,215,0,0.3) inset; }
    .title {
        font-size:2.4rem; font-weight:800; letter-spacing:4px; color:#fff5d1;
        text-shadow:0 4px 0 #9e0000, 0 8px 18px #ffaa00;
        margin-bottom:12px; display:flex; align-items:center; gap:12px;
        text-align:center; line-height:1.3;
    }
    .subhead {
        font-size:1rem; color:#ffe9b0; letter-spacing:2px; margin-bottom:24px;
        border-bottom:1px dashed rgba(255,215,0,0.5); padding-bottom:10px;
        width:100%; text-align:center; font-weight:300;
    }
    .flag-wrapper {
        position:relative; width:100%; aspect-ratio:3/2; background:#3a3a3a;
        border-radius:16px; box-shadow:0 0 0 4px #ffbb33, 0 25px 35px -8px black;
        margin-bottom:28px; overflow:hidden; border:1px solid #ffcc33;
        background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size:8.33% 16.66%;
    }
    .star-layer { position:absolute; inset:0; z-index:2; pointer-events:none; }
    .big-star { position:absolute; width:18%; left:8.33%; top:16.66%; transform:translate(-50%,-50%); z-index:3; }
    .small-star-1 { position:absolute; width:6%; left:19%; top:10.5%; transform:translate(-50%,-50%); z-index:3; }
    .small-star-2 { position:absolute; width:6%; left:25%; top:18%; transform:translate(-50%,-50%); z-index:3; }
    .small-star-3 { position:absolute; width:6%; left:25%; top:33%; transform:translate(-50%,-50%); z-index:3; }
    .small-star-4 { position:absolute; width:6%; left:19%; top:41%; transform:translate(-50%,-50%); z-index:3; }
    .star-svg-dark { width:100%; height:100%; display:block; fill:#555555; stroke:#666; stroke-width:0.5px; transition:fill 0.3s ease; }
    .tile-grid {
        position:absolute; inset:0; display:grid;
        grid-template-columns:repeat(6,1fr); grid-template-rows:repeat(4,1fr);
        z-index:4; pointer-events:none;
    }
    .tile {
        background:transparent; border:0.5px solid rgba(255,255,255,0.05);
        transition:background 0.3s ease, box-shadow 0.3s ease; position:relative;
    }
    .tile.lit {
        background: radial-gradient(circle at center, #ffd966 0%, #ffb347 60%, rgba(255,180,0,0.9) 100%);
        border:1px solid #ffcc33; z-index:5;
        animation: tileFlash 0.4s ease-out;
    }
    @keyframes tileFlash {
        0% { opacity:0.2; transform:scale(0.9); }
        100% { opacity:1; transform:scale(1); }
    }
    .control-panel {
        display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
        gap:25px; margin-top:10px; width:100%;
    }
    .btn-light {
        background:linear-gradient(145deg,#f5b042,#e68a00); border:none;
        border-radius:60px; padding:18px 36px; font-size:1.6rem; font-weight:700;
        color:#3d1e00; letter-spacing:2px; display:flex; align-items:center; gap:12px;
        box-shadow:0 12px 0 #8b4e00, 0 15px 25px rgba(0,0,0,0.4);
        cursor:pointer; transition:all 0.08s linear; border:1px solid #ffdc9a;
        transform:translateY(0); flex:0 0 auto;
    }
    .btn-light:active {
        transform:translateY(6px);
        box-shadow:0 6px 0 #8b4e00, 0 10px 20px rgba(0,0,0,0.5);
    }
    .btn-light:disabled {
        opacity:0.5; transform:translateY(6px);
        box-shadow:0 6px 0 #6b3e00, 0 8px 12px rgba(0,0,0,0.4);
        cursor:not-allowed; pointer-events:none; filter:grayscale(0.6);
    }
    .counter-box {
        background:#1a0a0a; border-radius:60px; padding:10px 30px;
        border:1px solid #ffbb33;
        display:flex; align-items:center; gap:14px;
        font-size:1.4rem; color:#ffecb3; font-weight:600;
    }
    .counter-box span:first-child { font-size:1rem; letter-spacing:1px; color:#ffd966; }
    .counter-number {
        font-size:2.2rem; font-weight:900; color:#fff3c9;
        min-width:70px; text-align:center; line-height:1.2;
    }
    /* ===== 表面重置按钮（移动端友好，始终可见） ===== */
    .reset-btn {
        position: fixed;
        bottom: 28px;
        right: 24px;
        z-index: 9999;
        background: #a83232;
        color: #fff5d1;
        border: 2px solid #ffb347;
        border-radius: 60px;
        padding: 16px 32px;
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: 2px;
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        box-shadow: 0 10px 25px rgba(180, 30, 30, 0.7), 0 0 0 2px rgba(255, 200, 0, 0.3);
        transition: all 0.15s ease;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
    }
    .reset-btn::before {
        content: "↺";
        font-size: 1.5rem;
        font-weight: 700;
        line-height: 1;
        display: inline-block;
        transform: translateY(-1px);
    }
    .reset-btn:active {
        transform: scale(0.94);
        background: #7a1f1f;
        box-shadow: 0 5px 15px rgba(180, 30, 30, 0.9), 0 0 0 3px rgba(255, 200, 0, 0.5);
    }
    .reset-btn:hover {
        background: #c43e3e;
        border-color: #ffd966;
    }
    .device-hint {
        font-size:0.95rem; color:#ffcc88; background:#1a0a0a;
        padding:8px 20px; border-radius:30px;
        border:1px solid rgba(255,200,0,0.4); letter-spacing:0.5px;
        display:inline-block; margin-top:6px;
    }
    .expired-hint {
        font-size:0.95rem; color:#ffaa88; background:#2a0a0a;
        padding:8px 20px; border-radius:30px;
        border:1px solid rgba(255,100,50,0.6); letter-spacing:0.5px;
        display:none; margin-top:6px;
    }
    .sync-status {
        font-size:0.8rem; color:#ffdd99; opacity:0.75;
        margin-top:14px; letter-spacing:0.5px; text-align:center;
        min-height:1.2em;
    }
    @media (max-width:600px) {
        .main-card { padding:20px 16px 32px; border-radius:32px; }
        .title { font-size:1.7rem; }
        .btn-light { font-size:1.2rem; padding:14px 22px; }
        .counter-box { padding:6px 16px; }
        .counter-number { font-size:1.7rem; min-width:50px; }
        .big-star { width:20%; }
        .small-star-1,.small-star-2,.small-star-3,.small-star-4 { width:7%; }
        .device-hint { font-size:0.8rem; padding:6px 14px; }
        /* 移动端重置按钮调整位置，避免遮挡内容 */
        .reset-btn {
            bottom: 20px;
            right: 16px;
            padding: 14px 24px;
            font-size: 1rem;
            border-radius: 50px;
        }
        .reset-btn::before { font-size: 1.3rem; }
    }
    @media (max-width:380px) {
        .reset-btn {
            bottom: 16px;
            right: 12px;
            padding: 12px 18px;
            font-size: 0.9rem;
        }
    }
</style>
</head>
<body>
    <div class="main-card">
        <div class="title">点亮红旗</div>
        <div class="subhead">汇聚星光，祝福祖国</div>

        <div class="flag-wrapper" id="flagWrapper">
            <div class="star-layer">
                <div class="big-star">
                    <svg class="star-svg-dark" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
                        <polygon points="50,5 61,38 95,38 68,57 79,91 50,70 21,91 32,57 5,38 39,38" />
                    </svg>
                </div>
                <div class="small-star-1">
                    <svg class="star-svg-dark" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
                        <polygon points="50,5 61,38 95,38 68,57 79,91 50,70 21,91 32,57 5,38 39,38" transform="rotate(35, 50, 50)" />
                    </svg>
                </div>
                <div class="small-star-2">
                    <svg class="star-svg-dark" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
                        <polygon points="50,5 61,38 95,38 68,57 79,91 50,70 21,91 32,57 5,38 39,38" transform="rotate(10, 50, 50)" />
                    </svg>
                </div>
                <div class="small-star-3">
                    <svg class="star-svg-dark" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
                        <polygon points="50,5 61,38 95,38 68,57 79,91 50,70 21,91 32,57 5,38 39,38" transform="rotate(-10, 50, 50)" />
                    </svg>
                </div>
                <div class="small-star-4">
                    <svg class="star-svg-dark" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
                        <polygon points="50,5 61,38 95,38 68,57 79,91 50,70 21,91 32,57 5,38 39,38" transform="rotate(-35, 50, 50)" />
                    </svg>
                </div>
            </div>
            <div class="tile-grid" id="tileGrid"></div>
        </div>

        <div class="control-panel">
            <button class="btn-light" id="lightBtn">
                <span class="star-icon"></span> 点亮红旗
            </button>
            <div class="counter-box">
                <span>已点亮</span>
                <span class="counter-number" id="counterDisplay">0</span>
                <span>/24</span>
            </div>
        </div>

        <div class="device-hint" id="deviceHint" style="margin-top:18px;">本设备已参与</div>
        <div class="expired-hint" id="expiredHint" style="margin-top:18px;">活动已于2026年10月7日结束，感谢参与</div>
        <div class="sync-status" id="syncStatus"></div>
    </div>

    <!-- ===== 表面重置按钮（始终可见，移动端友好） ===== -->
    <button class="reset-btn" id="resetBtn" aria-label="重置所有点亮记录">重置</button>

<script>
(function() {
    'use strict';

    // ============================================================
    // 【请修改】把下面这串替换成你自己的 Supabase anon key
    //   位置：Supabase 后台 → Settings → API → Project API keys → anon public
    // ============================================================
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdwYnByenJlbXpnbWpuaGpmd29yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2MzE2NTksImV4cCI6MjA5ODIwNzY1OX0.JT_c4syLtO6xhy0TrBPfEEWO2QFQe_tmbIYHb1EpOa8';

    const SUPABASE_URL = 'https://gpbprzremzgmjnhjfwor.supabase.co';
    const TABLE = 'flag_lit_tiles';
    const COL = 'tile_index';

    const TOTAL_TILES = 24;
    const DEVICE_KEY = 'flag_device_lit_v3';
    const END_DATE = new Date(2026, 9, 7, 23, 59, 59);

    let litTiles = [];
    let deviceAlreadyLit = false;
    let isExpired = false;
    let isSyncing = false;

    const tileGrid = document.getElementById('tileGrid');
    const lightBtn = document.getElementById('lightBtn');
    const counterDisplay = document.getElementById('counterDisplay');
    const deviceHint = document.getElementById('deviceHint');
    const resetBtn = document.getElementById('resetBtn');
    const expiredHint = document.getElementById('expiredHint');
    const syncStatus = document.getElementById('syncStatus');

    const headers = {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json'
    };

    // ---------- Supabase 操作 ----------
    async function fetchTiles() {
        try {
            const url = `${SUPABASE_URL}/rest/v1/${TABLE}?select=${COL}`;
            const res = await fetch(url, { headers });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            if (Array.isArray(data)) {
                return data.map(r => Number(r[COL])).filter(n => Number.isInteger(n) && n >= 0 && n < TOTAL_TILES);
            }
            return [];
        } catch (e) {
            console.warn('[拉取失败]', e);
            return null;
        }
    }

    async function insertTile(idx) {
        try {
            const url = `${SUPABASE_URL}/rest/v1/${TABLE}`;
            const res = await fetch(url, {
                method: 'POST',
                headers: { ...headers, 'Prefer': 'return=minimal' },
                body: JSON.stringify({ [COL]: idx })
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
            return true;
        } catch (e) {
            console.warn('[插入失败]', e);
            setSyncStatus('❌ 插入失败：' + e.message, false);
            return false;
        }
    }

    async function deleteAllTiles() {
        try {
            const url = `${SUPABASE_URL}/rest/v1/${TABLE}?id=gt.0`;
            const res = await fetch(url, {
                method: 'DELETE',
                headers: { ...headers, 'Prefer': 'return=minimal' }
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return true;
        } catch (e) {
            console.warn('[清空失败]', e);
            return false;
        }
    }

    // ---------- 渲染 & UI ----------
    function checkExpired() {
        isExpired = new Date() > END_DATE;
        return isExpired;
    }

    function buildTileGrid() {
        tileGrid.innerHTML = '';
        for (let i = 0; i < TOTAL_TILES; i++) {
            const tile = document.createElement('div');
            tile.className = 'tile';
            tile.dataset.index = i;
            tileGrid.appendChild(tile);
        }
    }

    function renderLitTiles() {
        const tiles = tileGrid.children;
        for (let i = 0; i < tiles.length; i++) {
            tiles[i].classList.toggle('lit', litTiles.includes(i));
        }
        const count = litTiles.length;
        counterDisplay.textContent = count;

        const full = count >= TOTAL_TILES;

        if (full || deviceAlreadyLit || isExpired) {
            lightBtn.disabled = true;
        } else {
            lightBtn.disabled = false;
        }

        if (full) {
            deviceHint.innerHTML = '红旗已点亮，感谢每位参与者';
            deviceHint.style.color = '#aaffaa';
        } else if (deviceAlreadyLit) {
            deviceHint.innerHTML = '本设备已参与';
            deviceHint.style.color = '#ffcc88';
        } else {
            deviceHint.innerHTML = '本设备尚未参与';
            deviceHint.style.color = '#ffcc88';
        }

        if (isExpired) {
            expiredHint.style.display = 'inline-block';
            deviceHint.style.display = 'none';
        } else {
            expiredHint.style.display = 'none';
            deviceHint.style.display = 'inline-block';
        }
    }

    function setSyncStatus(text, ok) {
        syncStatus.textContent = text || '';
        syncStatus.style.color = ok === false ? '#ff9988' : '#ffdd99';
    }

    // ---------- 业务逻辑 ----------
    async function refreshFromCloud() {
        const remote = await fetchTiles();
        if (remote === null) {
            setSyncStatus('云端同步失败，请检查网络或 anon key', false);
            return;
        }
        litTiles = [...new Set(remote)].sort((a, b) => a - b);
        renderLitTiles();
        const now = new Date();
        const t = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
        setSyncStatus(`已同步 · ${t}`);
    }

    async function handleLightUp() {
        if (isSyncing) return;

        if (checkExpired()) {
            alert('活动已于2026年10月7日结束，感谢您的关注与参与！');
            renderLitTiles();
            return;
        }
        if (deviceAlreadyLit) {
            alert('每个设备只能点亮一次，感谢你的参与！');
            return;
        }
        if (litTiles.length >= TOTAL_TILES) {
            alert('红旗已点亮，感谢您的参与');
            renderLitTiles();
            return;
        }

        const allIndices = Array.from({ length: TOTAL_TILES }, (_, i) => i);
        const available = allIndices.filter(i => !litTiles.includes(i));
        if (available.length === 0) {
            renderLitTiles();
            return;
        }
        const picked = available[Math.floor(Math.random() * available.length)];

        isSyncing = true;
        lightBtn.disabled = true;
        setSyncStatus('正在同步到云端...');

        litTiles.push(picked);
        litTiles.sort((a, b) => a - b);
        renderLitTiles();
        localStorage.setItem(DEVICE_KEY, 'true');
        deviceAlreadyLit = true;

        const ok = await insertTile(picked);
        isSyncing = false;

        if (!ok) {
            litTiles = litTiles.filter(i => i !== picked);
            localStorage.removeItem(DEVICE_KEY);
            deviceAlreadyLit = false;
            renderLitTiles();
            setSyncStatus('同步失败，请重试', false);
            alert('点亮失败：无法连接云端，请稍后再试。');
            return;
        }

        await refreshFromCloud();

        if (litTiles.length >= TOTAL_TILES) {
            setTimeout(() => alert('🎉 红旗已点亮，感谢您的参与！'), 150);
        }
    }

    // ---------- 重置（表面按钮直接调用） ----------
    async function handleReset() {
        if (!confirm('确定要重置所有点亮记录吗？此操作会清空云端所有数据。')) return;
        setSyncStatus('正在清空云端...');
        const ok = await deleteAllTiles();
        if (ok) {
            litTiles = [];
            localStorage.removeItem(DEVICE_KEY);
            deviceAlreadyLit = false;
            renderLitTiles();
            setSyncStatus('云端已清空');
        } else {
            setSyncStatus('清空失败', false);
        }
    }

    // ---------- 初始化 ----------
    async function initialize() {
        checkExpired();
        buildTileGrid();

        deviceAlreadyLit = localStorage.getItem(DEVICE_KEY) === 'true';

        await refreshFromCloud();

        lightBtn.addEventListener('click', handleLightUp);
        // 表面重置按钮直接绑定，不再需要 Alt+W
        resetBtn.addEventListener('click', handleReset);

        // 保留 Alt+W 作为备用（方便桌面用户），但按钮已始终可见
        window.addEventListener('keydown', function(e) {
            if (e.altKey && (e.key === 'w' || e.key === 'W' || e.keyCode === 87)) {
                e.preventDefault();
                handleReset();
            }
        });

        setInterval(refreshFromCloud, 10000);

        if (isExpired) {
            console.log('活动已于2026年10月7日截止，点亮功能已关闭。');
        }
    }

    if (document.readyState === 'complete') {
        initialize();
    } else {
        window.addEventListener('load', initialize);
    }
})();
</script>

<!-- 源代码保护（精简版） -->
<script>
(function() {
    'use strict';
    document.addEventListener('contextmenu', e => { e.preventDefault(); return false; }, { capture: true });
    document.addEventListener('keydown', e => {
        if (e.key === 'F12' || e.keyCode === 123) { e.preventDefault(); return false; }
        if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.keyCode === 73)) { e.preventDefault(); return false; }
        if (e.ctrlKey && e.shiftKey && (e.key === 'J' || e.key === 'j' || e.keyCode === 74)) { e.preventDefault(); return false; }
        if (e.ctrlKey && e.shiftKey && (e.key === 'C' || e.key === 'c' || e.keyCode === 67)) { e.preventDefault(); return false; }
        if (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.keyCode === 85)) { e.preventDefault(); return false; }
    }, { capture: true });
    document.addEventListener('dragstart', e => { e.preventDefault(); return false; });
})();
</script>
</body>
</html>
